<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" role="img" aria-labelledby="title desc">
  <title id="title">ステージ1 民意のかけらを集める盤面</title>
  <desc id="desc">選挙、国会、内閣、裁判所、地方自治の五つの門を結ぶ十五マスのすごろく盤面</desc>
  <defs>
