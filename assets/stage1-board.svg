    <g transform="translate(250 92)"><rect width="168" height="82" rx="14" fill="#244f8e" stroke="#f1cf69" stroke-width="4"/><text x="84" y="32" font-size="15">第2の門</text><text x="84" y="61" font-size="25">国会</text></g>
    <g transform="translate(548 305)"><rect width="168" height="82" rx="14" fill="#7a5a20" stroke="#f1cf69" stroke-width="4"/><text x="84" y="32" font-size="15">第3の門</text><text x="84" y="61" font-size="25">内閣</text></g>
    <g transform="translate(782 70)"><rect width="168" height="82" rx="14" fill="#554187" stroke="#f1cf69" stroke-width="4"/><text x="84" y="32" font-size="15">第4の門</text><text x="84" y="61" font-size="25">裁判所</text></g>
    <g transform="translate(1038 258)"><rect width="168" height="82" rx="14" fill="#26735d" stroke="#f1cf69" stroke-width="4"/><text x="84" y="32" font-size="15">第5の門</text><text x="84" y="61" font-size="25">地方自治</text></g>
  </g>
